<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0221">
<title>📻 Μήνυμα από τον Οικοδεσπότη — NEON SPLASH IV</title>
<meta property="og:title" content="📻 Μήνυμα από τον Οικοδεσπότη — NEON SPLASH IV">
<meta property="og:description" content="Λύστε τον γρίφο για να αποκωδικοποιήσετε το μήνυμα. Παίξτε από το κινητό σας.">
<meta property="og:image" content="preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Noto+Sans:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#0d0221;
    --bg-mid:#2b0b5e;
    --bg-low:#7a1f5c;
    --neon-pink:#ff2bd6;
    --neon-cyan:#17f5ff;
    --ink:#fdf2ff;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh; min-height:100dvh;
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 55%,var(--bg-low) 100%);
    color:var(--ink);
    font-family:'Noto Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  .scene{ position:fixed; inset:0; z-index:0; overflow:hidden; }
  .sun{
    position:absolute; left:50%; top:14%; width:220px; height:220px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:linear-gradient(180deg,#ffd35c 0%,#ff9a56 32%,#ff5f7e 62%,#ff2bd6 100%);
    box-shadow:0 0 90px 14px rgba(255,60,180,.4);
    overflow:hidden;
  }
  .sun::before{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(to bottom, transparent 0 7px, var(--bg-top) 7px 12px);
    -webkit-mask-image:linear-gradient(to bottom, transparent 44%, black 46%);
            mask-image:linear-gradient(to bottom, transparent 44%, black 46%);
  }
  .grid{
    position:absolute; left:-10%; right:-10%; bottom:0; height:38%;
    background-image:
      linear-gradient(rgba(255,43,214,.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,43,214,.5) 1px, transparent 1px);
    background-size:56px 56px;
    transform:perspective(280px) rotateX(62deg);
    transform-origin:bottom;
    -webkit-mask-image:linear-gradient(to top, black 25%, transparent 92%);
            mask-image:linear-gradient(to top, black 25%, transparent 92%);
    animation:gridScroll 5s linear infinite;
  }
  @keyframes gridScroll{ from{ background-position-y:0; } to{ background-position-y:56px; } }
  @media (prefers-reduced-motion:reduce){ .grid{ animation:none; } }

  .panel{
    position:relative; z-index:1;
    max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:36px 20px 40px; text-align:center;
  }
  .screen{ display:none; width:100%; flex-direction:column; align-items:center; gap:14px; margin:auto 0; }
  .screen.active{ display:flex; }
  #screen-game.active{ margin:0; padding-bottom:300px; transition:padding-bottom .3s ease; }
  #screen-game.active.solved{ padding-bottom:20px; }

  .eyebrow{ margin:0; font-size:.7rem; font-weight:700; letter-spacing:2px; color:var(--neon-cyan);
    text-shadow:0 0 8px rgba(23,245,255,.7); }
  .hero{ margin:2px 0 0; font-family:'Monoton',cursive; font-weight:400;
    font-size:clamp(2rem,9vw,3.2rem); line-height:1.05; letter-spacing:2px; color:#fff2fb;
    text-shadow:0 0 6px var(--neon-pink),0 0 20px var(--neon-pink),0 0 42px var(--neon-pink); }
  .hero span{ color:var(--neon-cyan);
    text-shadow:0 0 6px var(--neon-cyan),0 0 20px var(--neon-cyan),0 0 42px var(--neon-cyan); }
  .tagline{ margin:0; font-size:.8rem; font-weight:700; letter-spacing:4px; opacity:.85; }
  .body-copy{ margin:6px 0 0; font-size:1rem; font-weight:700; line-height:1.6; opacity:.95; max-width:32ch; }

  .bravo{ margin:0; font-weight:900; font-size:clamp(1.4rem,7vw,2rem); letter-spacing:.5px;
    color:#fff2fb; text-shadow:0 0 6px var(--neon-pink),0 0 20px var(--neon-pink),0 0 40px var(--neon-pink); }

  .btn-primary,.btn-secondary{
    margin-top:6px; padding:14px 26px; border-radius:999px; border:2px solid var(--neon-pink);
    background:rgba(255,43,214,.08); color:#fff; font-family:inherit; font-weight:900;
    letter-spacing:.5px; font-size:.95rem; box-shadow:0 0 16px rgba(255,43,214,.45); cursor:pointer;
  }
  .btn-secondary{ border-color:var(--neon-cyan); background:rgba(23,245,255,.08);
    box-shadow:0 0 16px rgba(23,245,255,.4); }
  .btn-primary:active,.btn-secondary:active{ transform:scale(.97); }
  .btn-primary:focus-visible,.btn-secondary:focus-visible{ outline:3px solid var(--neon-cyan); outline-offset:3px; }

  .hint{ margin:0; font-size:.65rem; font-weight:700; letter-spacing:1.5px; opacity:.6; }

  .message-card{ background:rgba(13,2,33,.55); border:1px solid rgba(23,245,255,.2);
    border-radius:16px; padding:18px 16px; margin-top:4px; }
  .message{ margin:0; font-weight:700; font-size:clamp(1rem,4.2vw,1.2rem); }
  .sentence{ display:block; line-height:2; margin:0 0 12px; }
  .sentence:last-child{ margin-bottom:0; }
  .word{ display:inline-block; white-space:nowrap; }
  .ch{ display:inline-block; }
  .ch.letter{ min-width:.68em; border-bottom:2px solid var(--neon-cyan); text-align:center; }
  .ch.letter.revealed{ border-bottom-color:transparent; text-shadow:0 0 8px var(--neon-cyan);
    animation:pop .2s ease; }
  @keyframes pop{ from{ transform:scale(1.4); } to{ transform:scale(1); } }

  .result{ margin-top:18px; width:100%; display:flex; flex-direction:column; align-items:center; gap:10px;
    opacity:0; transform:translateY(10px); transition:opacity .4s ease, transform .4s ease; pointer-events:none; }
  .result.visible{ opacity:1; transform:none; pointer-events:auto; }

  .game-controls{ position:fixed; left:0; right:0; bottom:0; z-index:5;
    display:none; flex-direction:column; align-items:center; gap:8px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(13,2,33,.9); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-top:1px solid rgba(23,245,255,.25); }
  .game-controls.visible{ display:flex; }

  .signal{ display:flex; align-items:center; gap:10px; }
  .signal-label{ font-size:.65rem; font-weight:700; letter-spacing:2px; opacity:.7; }
  .bars{ display:flex; gap:3px; align-items:flex-end; height:22px; }
  .bar{ width:8px; background:var(--neon-pink); box-shadow:0 0 6px var(--neon-pink); border-radius:1px; }
  .bar:nth-child(1){ height:9px; } .bar:nth-child(2){ height:15px; } .bar:nth-child(3){ height:21px; }
  .bar.dead{ background:#3a2450; box-shadow:none; opacity:.5; }

  .keyboard{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; max-width:400px; }
  .key{ min-width:32px; min-height:42px; padding:0 3px; border-radius:8px; border:1px solid var(--neon-cyan);
    background:rgba(23,245,255,.06); color:#eafcff; font-family:inherit; font-weight:900;
    font-size:.9rem; cursor:pointer; }
  .key:focus-visible{ outline:3px solid var(--neon-pink); outline-offset:2px; }
  .key.correct{ background:var(--neon-cyan); color:#062226; }
  .key.wrong{ opacity:.28; border-color:#5a3d73; }
  .key:disabled{ cursor:default; }

  .invite-card{ display:flex; flex-direction:column; gap:8px; padding:16px 24px;
    border:2px solid var(--neon-cyan); border-radius:16px; background:rgba(23,245,255,.05);
    box-shadow:0 0 26px rgba(23,245,255,.3); }
  .invite-row{ font-weight:900; font-size:clamp(1.1rem,5.5vw,1.45rem); letter-spacing:.5px; }
</style>
</head>
<body>
  <div class="scene" aria-hidden="true"><div class="sun"></div><div class="grid"></div></div>

  <main class="panel">

    <section id="screen-intro" class="screen active">
      <p class="eyebrow">📻 ΟΙΚΟΔΕΣΠΟΤΗΣ ΠΡΙΣΕΝΤΖ:</p>
      <h1 class="hero" lang="en">NEON SPLASH <span>IV</span></h1>
      <p class="tagline" lang="en">THE FINAL CHAPTER</p>
      <p class="body-copy">ΕΧΕΤΕ ΜΗΝΥΜΑ ΑΠΟ ΤΟΝ ΟΙΚΟΔΕΣΠΟΤΗ. ΛΥΣΤΕ ΤΟΝ ΠΑΡΑΚΑΤΩ ΓΡΙΦΟ ΓΙΑ ΝΑ ΤΟ ΑΠΟΚΩΔΙΚΟΠΟΙΗΣΕΤΕ.</p>
      <button id="btn-start" class="btn-primary" type="button">▶ ΑΠΟΚΩΔΙΚΟΠΟΙΗΣΗ</button>
    </section>

    <section id="screen-game" class="screen">
      <p class="eyebrow">📡 ΕΙΣΕΡΧΟΜΕΝΟ ΜΗΝΥΜΑ</p>
      <div class="message-card"><p class="message" id="message"></p></div>
      <div class="result" id="result">
        <p class="bravo">ΜΩΡΕ ΜΠΡΡΡΑΑΑΒΟ!</p>
        <div class="invite-card"><div class="invite-row">22 ΑΥΓΟΥΣΤΟΥ | 19:00</div></div>
        <button id="btn-again" class="btn-secondary" type="button">↻ ΠΑΙΞΤΕ ΞΑΝΑ</button>
      </div>
    </section>

  </main>

  <div class="game-controls" id="gameControls">
    <div class="signal">
      <span class="signal-label">ΣΗΜΑ</span>
      <div class="bars" id="bars"></div>
    </div>
    <div class="keyboard" id="keyboard"></div>
    <p class="hint">ΠΑΤΗΣΤΕ ΓΡΑΜΜΑΤΑ ↑</p>
  </div>

<script>
  var GREEK_ALPHABET = 'ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ';
  var SENTENCES = [
    'Η ΗΜΕΡΟΜΗΝΙΑ ΓΙΑ ΤΟ ΠΑΡΤΥ ΕΙΝΑΙ ΣΤΙΣ ΕΙΚΟΣΙ ΔΥΟ ΑΥΓΟΥΣΤΟΥ ΣΤΙΣ ΕΠΤΑ ΤΟ ΑΠΟΓΕΥΜΑ.',
    'ΟΠΩΣ ΑΛΛΩΣΤΕ ΑΝΑΓΡΑΦΕΙ ΚΑΙ ΤΟ ΠΟΣΤΕΡ ΠΟΥ ΚΑΝΕΙΣ ΔΕΝ ΒΛΕΠΕΙ ΠΟΤΕ ΓΙΑ ΚΑΠΟΙΟ ΛΟΓΟ.',
    'ΠΡΕΠΕΙ ΝΑ ΦΤΙΑΞΟΥΜΕ ΟΛΟΚΛΗΡΟ ΠΑΙΧΝΙΔΙ ΕΔΩ ΧΑΜΩ ΜΠΑΣ ΚΑΙ ΤΟ ΜΑΘΕΤΕ ΝΑ ΠΟΥΜΕ.'
  ];
  var MAX_WRONG = 3;
  var messageLetters, guessed, wrong;
  var audioCtx;

  function beep(freq, type, duration){
    duration = duration || 0.09;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq;
      gain.gain.value = 0.06;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }catch(e){}
  }

  function buildMessage(){
    var container = document.getElementById('message');
    container.innerHTML = '';
    SENTENCES.forEach(function(sentence){
      var line = document.createElement('div');
      line.className = 'sentence';
      var words = sentence.split(' ');
      words.forEach(function(word, wi){
        var wordSpan = document.createElement('span');
        wordSpan.className = 'word';
        word.split('').forEach(function(ch){
          if(GREEK_ALPHABET.indexOf(ch) !== -1){
            var letter = document.createElement('span');
            letter.className = 'ch letter';
            letter.dataset.letter = ch;
            letter.textContent = '\u00A0';
            wordSpan.appendChild(letter);
          } else {
            wordSpan.appendChild(document.createTextNode(ch));
          }
        });
        line.appendChild(wordSpan);
        if(wi < words.length - 1){
          line.appendChild(document.createTextNode(' '));
        }
      });
      container.appendChild(line);
    });
  }

  function buildKeyboard(){
    var kb = document.getElementById('keyboard');
    kb.innerHTML = '';
    GREEK_ALPHABET.split('').forEach(function(letter){
      var b = document.createElement('button');
      b.className = 'key'; b.type = 'button'; b.textContent = letter;
      b.addEventListener('click', function(){ guess(letter, b); });
      kb.appendChild(b);
    });
  }

  function buildBars(){
    var bars = document.getElementById('bars');
    bars.innerHTML = '';
    for(var i = 0; i < MAX_WRONG; i++){
      var bar = document.createElement('span');
      bar.className = 'bar';
      bars.appendChild(bar);
    }
  }

  function guess(letter, btn){
    if(guessed.has(letter)) return;
    guessed.add(letter);
    btn.disabled = true;
    if(messageLetters.indexOf(letter) !== -1){
      btn.classList.add('correct');
      beep(880, 'triangle');
      revealLetter(letter);
      checkWin();
    } else {
      btn.classList.add('wrong');
      beep(140, 'sawtooth', 0.14);
      wrong++;
      var bars = document.querySelectorAll('.bar');
      if(bars[wrong - 1]) bars[wrong - 1].classList.add('dead');
      if(wrong >= MAX_WRONG) endGame();
    }
  }

  function revealLetter(letter){
    document.querySelectorAll('.ch.letter[data-letter="' + letter + '"]').forEach(function(el){
      el.textContent = letter;
      el.classList.add('revealed');
    });
  }

  function checkWin(){
    var letters = document.querySelectorAll('.ch.letter');
    var done = Array.from(letters).every(function(el){ return el.classList.contains('revealed'); });
    if(done) endGame();
  }

  function endGame(){
    document.querySelectorAll('.ch.letter').forEach(function(el){
      el.textContent = el.dataset.letter;
      el.classList.add('revealed');
    });
    document.getElementById('gameControls').classList.remove('visible');
    document.getElementById('screen-game').classList.add('solved');
    var result = document.getElementById('result');
    result.classList.add('visible');
    result.scrollIntoView({behavior:'smooth', block:'center'});
  }

  function resetGame(){
    guessed = new Set();
    wrong = 0;
    messageLetters = Array.from(new Set(SENTENCES.join('').split('').filter(function(c){
      return GREEK_ALPHABET.indexOf(c) !== -1;
    })));
    buildMessage();
    buildKeyboard();
    buildBars();
  }

  function playAgain(){
    document.getElementById('result').classList.remove('visible');
    document.getElementById('screen-game').classList.remove('solved');
    document.getElementById('gameControls').classList.add('visible');
    resetGame();
    window.scrollTo(0, 0);
  }

  document.getElementById('btn-start').addEventListener('click', function(){
    document.getElementById('screen-intro').classList.remove('active');
    document.getElementById('screen-game').classList.add('active');
    document.getElementById('gameControls').classList.add('visible');
    window.scrollTo(0, 0);
  });

  document.getElementById('btn-again').addEventListener('click', playAgain);

  resetGame();
</script>
</body>
</html>
